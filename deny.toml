# cargo-deny policy: only AGPL-3.0-compatible licenses, no known advisories (Constitution, Licensing section).

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"
# Unmaintained notices fail the build for our direct dependencies only; transitive ones are tracked upstream.
unmaintained = "workspace"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "MIT",
    "MIT-0",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
    "OpenSSL",
    "CDLA-Permissive-2.0",
    "BSL-1.0",
    "GPL-3.0",
    "GPL-3.0-or-later",
    "AGPL-3.0",
    "AGPL-3.0-or-later",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
